# 官网 app.sdprcq.cc — 80 端口：ACME 验证 + 跳转
# 注：证书签发前先跳 http://…:8888，拿到证书后改为 https://app.sdprcq.cc:8888
server {
    listen 80;
    listen [::]:80;
    server_name app.sdprcq.cc;

    # Let's Encrypt HTTP-01 验证保留（当前境外源被边缘拦截不可用，
    # 仅在备案后可用；DNS-01 签发不影响此路径）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 http://app.sdprcq.cc:8888$request_uri;
    }
}
