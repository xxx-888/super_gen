# 斯迪普瑞公司官网（静态单页）— https://app.sdprcq.cc:8888
# 证书就绪后启用：cp 本文件到 sites-available/sdprcq-site && nginx -t && systemctl reload nginx
# 证书路径为 Let's Encrypt DNS-01 签发的 app.sdprcq.cc
server {
    listen 8888 ssl http2;
    listen [::]:8888 ssl http2;
    server_name app.sdprcq.cc;

    ssl_certificate     /etc/letsencrypt/live/app.sdprcq.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.sdprcq.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_sdprcq:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/sdprcq-site;
    index index.html;

    # HSTS：确认全站 HTTPS 稳定后再开启（避免 http 调试期锁死）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/sdprcq-site.access.log;
    error_log  /var/log/nginx/sdprcq-site.error.log;
}
