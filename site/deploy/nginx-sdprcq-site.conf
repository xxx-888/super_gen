# 斯迪普瑞公司官网（静态单页）— http://app.sdprcq.cc:8888
# 注：证书签发后切换到 sdprcq-site.ssl（HTTPS 监听）
server {
    listen 8888;
    listen [::]:8888;
    server_name app.sdprcq.cc;

    root /opt/sdprcq-site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 截图等静态资源长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/sdprcq-site.access.log;
    error_log  /var/log/nginx/sdprcq-site.error.log;
}
